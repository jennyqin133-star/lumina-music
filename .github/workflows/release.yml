# Build, sign, notarize, package, and release Lumina Music when a tag is pushed.
#
# Trigger:
#   git tag v0.1.1 && git push origin v0.1.1
#
# Outputs:
#   - GitHub Release with Lumina-Music-<version>.dmg attached
#   - Updated appcast.xml committed to the gh-pages branch
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#
#   APPLE_TEAM_ID                  10-char Apple Developer Team ID
#   APPLE_ID                       Apple ID email used for notarization
#   APPLE_APP_PASSWORD             App-specific password from appleid.apple.com
#   DEVELOPER_ID_CERT_P12_BASE64   Base64-encoded .p12 export of "Developer ID
#                                  Application" cert + its private key
#   DEVELOPER_ID_CERT_PASSWORD     Password for the .p12 file
#   DEVELOPER_ID                   "Developer ID Application: <name> (TEAMID)"
#                                  (matches the common name on the cert)
#   SPARKLE_PUBLIC_KEY             Base64 EdDSA public key (single line)
#   SPARKLE_PRIV_KEY               Base64 EdDSA private key (single line)
#
# If any signing/notarization secret is missing, the workflow still produces an
# unsigned DMG (so dry-run distribution still works), but users will need to
# right-click → Open the first time.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # Required for gh release create + appcast push

jobs:
  release:
    name: Build, sign, notarize, release
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history needed for tag-based notes

      - name: Show toolchain
        run: swift --version

      - name: Compute version
        id: version
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve SwiftPM dependencies
        run: swift package resolve

      - name: Install signing certificate
        if: ${{ env.DEVELOPER_ID_CERT_P12_BASE64 != '' }}
        env:
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN=ci-build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$DEVELOPER_ID_CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Make the signing keychain the default & first in search list,
          # while keeping the login keychain available.
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | sed -e 's/"//g')
          security default-keychain -s "$KEYCHAIN"

          rm -f /tmp/cert.p12
          echo "✓ Signing certificate installed."

      - name: Generate app icon
        run: scripts/make-icon.sh

      - name: Build, bundle, sign .app
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: scripts/build-app.sh

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package DMG
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
        run: scripts/package-dmg.sh

      - name: Notarize DMG
        if: ${{ env.APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="dist/Lumina-Music-${{ steps.version.outputs.version }}.dmg"
          scripts/notarize.sh "$DMG"

      - name: Generate Sparkle appcast
        if: ${{ env.SPARKLE_PRIV_KEY != '' }}
        env:
          SPARKLE_PRIV_KEY: ${{ secrets.SPARKLE_PRIV_KEY }}
          SPARKLE_DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}/releases/download
          SUFEEDURL_OVERRIDE: https://${{ github.repository_owner }}.github.io/lumina-music/appcast.xml
        run: scripts/sparkle-appcast.sh

      - name: Publish to gh-pages
        if: ${{ env.SPARKLE_PRIV_KEY != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIV_KEY: ${{ secrets.SPARKLE_PRIV_KEY }}
        run: |
          # Mirror the freshly built appcast.xml into the gh-pages branch.
          git config user.name  "lumina-music-release"
          git config user.email "release@lumina.local"

          mkdir -p /tmp/gh-pages
          cd /tmp/gh-pages
          git init -b gh-pages 2>/dev/null || git checkout gh-pages 2>/dev/null
          git remote remove origin 2>/dev/null || true
          git remote add origin https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git

          # Pull existing gh-pages if it exists.
          if git fetch origin gh-pages 2>/dev/null; then
            git reset --hard origin/gh-pages
          fi

          cp -f "$GITHUB_WORKSPACE/gh-pages-checkout/appcast.xml" appcast.xml

          # Tiny landing page for the feed URL.
          cat > index.html <<HTML
          <!DOCTYPE html><html><head><meta charset="utf-8"><title>Lumina Music — releases</title>
          <body style="font-family:-apple-system,system-ui;max-width:48em;margin:3em auto;padding:0 1em">
          <h1>Lumina Music</h1>
          <p>The latest release is at
          <a href="https://github.com/${{ github.repository }}/releases/latest">GitHub Releases</a>.</p>
          <p>This page exists so Sparkle can fetch <code><a href="appcast.xml">appcast.xml</a></code>.</p>
          </body></html>
          HTML

          git add appcast.xml index.html
          git commit -m "release ${{ steps.version.outputs.tag }}" || echo "no changes"
          git push -u origin gh-pages

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG="dist/Lumina-Music-${{ steps.version.outputs.version }}.dmg"
          NOTES_FROM_TAG="$(git tag -l --format='%(contents)' ${{ steps.version.outputs.tag }})"
          gh release create "${{ steps.version.outputs.tag }}" "$DMG" \
            --title "Lumina Music ${{ steps.version.outputs.tag }}" \
            --notes "$NOTES_FROM_TAG"
